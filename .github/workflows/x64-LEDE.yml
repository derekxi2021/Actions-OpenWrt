name: Build x86-64-LEDE

on:
  repository_dispatch:
  schedule:
    - cron: 0 1 1 * *
  workflow_dispatch:
    inputs:
      ssh:
        description: 'SSH connection to Actions'
        required: false
        default: 'false'

env:
  REPO_URL: https://github.com/coolsnowwolf/lede
  REPO_BRANCH: master
  FEEDS_CONF: config/feeds.conf.LEDE
  CONFIG_FILE: config/x64-LEDE.config
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  UPLOAD_BIN_DIR: false
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai
  CCACHE_DIR: /home/runner/.ccache
  CCACHE_BASEDIR: /workdir/openwrt
  CCACHE_NOHASHDIR: "true"
  CCACHE_SLOPPINESS: time_macros,include_file_mtime,include_file_ctime,file_stat_matches,pch_defines
  
jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      actions: write
      
    steps:
    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        sudo docker image prune --all --force
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential bzip2 ccache cmake cpio curl device-tree-compiler fastjar flex gawk gettext gcc-multilib g++-multilib git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libfuse-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libpython3-dev libreadline-dev libssl-dev libtool lrzsz mkisofs msmtp ninja-build p7zip p7zip-full patch pkgconf python2.7 python3 python3-pyelftools python3-setuptools qemu-utils rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /workdir
        sudo chown $USER:$GROUPS /workdir
        echo "/usr/lib/ccache" >> $GITHUB_PATH

    - name: Maximize build space
      uses: easimon/maximize-build-space@master
      with:
        root-reserve-mb: 2048
        swap-size-mb: 1024
        temp-reserve-mb: 512
        remove-dotnet: 'true'
        remove-android: 'true'
        remove-haskell: 'true'
        remove-codeql: 'true'
        remove-docker-images: 'true'
        build-mount-path: '/workdir'

    - name: Redirect TMPDIR to workdir
      run: |
        sudo mkdir -p /workdir/tmp
        sudo chmod 1777 /workdir/tmp
        echo "TMPDIR=/workdir/tmp" >> $GITHUB_ENV
        
    - name: Checkout
      uses: actions/checkout@v4
#      with:
#        fetch-depth: 0
        
#    - name: Free Disk Space (Ubuntu)
#      uses: jlumbroso/free-disk-space@main
#      with:
        # this might remove tools that are actually needed,
        # if set to "true" but frees about 6 GB
#        tool-cache: false
        
        # all of these default to true, but feel free to set to
        # "false" if necessary for your workflow
#        android: true
#        dotnet: true
#        haskell: true
#        large-packages: true
#        docker-images: true
#        swap-storage: true


    # 1. Ccache 远程缓存恢复/保存
    - name: Cache Ccache Files
      uses: actions/cache@v4
      with:
        path: ~/.ccache
        key: ${{ runner.os }}-openwrt-ccache-x86-lede-${{ github.ref_name }}
        restore-keys: |
          ${{ runner.os }}-openwrt-ccache-x86-lede-${{ github.ref_name }}
          ${{ runner.os }}-openwrt-ccache-x86-lede-
          ${{ runner.os }}-openwrt-ccache-

     # 2. Host Tools 远程缓存恢复/保存
    - name: Cache Host Tools
      uses: actions/cache@v4
      with:
        path: /workdir/host_cache
        key: ${{ runner.os }}-openwrt-host-x86-lede-${{ github.ref_name }}
        restore-keys: |
          ${{ runner.os }}-openwrt-host-x86-lede-${{ github.ref_name }}
          ${{ runner.os }}-openwrt-host-x86-lede-

    # 3. 初始化 Ccache 压缩与大小
    - name: Init Ccache Config
      run: |
        mkdir -p ~/.ccache
        ccache -M 5G
        ccache -o compression=true
        ccache -z
          
    - name: Clone source code
      working-directory: /workdir
      run: |
        df -hT $PWD
        rm -rf openwrt
        git clone $REPO_URL -b $REPO_BRANCH openwrt
        
        # 还原 Host Tools 缓存到 openwrt/staging_dir
        if [ -d "/workdir/host_cache/host" ]; then
          echo "Restoring Host Tools Cache..."
          mkdir -p openwrt/staging_dir
          cp -rn /workdir/host_cache/* openwrt/staging_dir/
        fi

        ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt
    
    - name: Load custom feeds
      run: |
        [ -e $FEEDS_CONF ] && mv $FEEDS_CONF openwrt/feeds.conf.default
        chmod +x $DIY_P1_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P1_SH

    - name: Update feeds
      run: cd openwrt && ./scripts/feeds update -a

    - name: Install feeds
      run: cd openwrt && ./scripts/feeds install -a

    - name: Load custom configuration
      run: |
        [ -e files ] && mv files openwrt/files
        [ -e $CONFIG_FILE ] && mv $CONFIG_FILE openwrt/.config
        chmod +x $DIY_P2_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P2_SH

    - name: Download package
      id: package
      run: |
        cd openwrt
        make defconfig
        make download -j8
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;
        
    - name: Compile the firmware
      id: compile
      run: |
        cd openwrt
        # 写入 Ccache 编译开关
        export CCACHE_DIR=/home/runner/.ccache
        export CCACHE_BASEDIR=/workdir/openwrt
        export PATH="/usr/lib/ccache:$PATH"
        sed -i '/CONFIG_CCACHE/d' .config
        echo "CONFIG_CCACHE=y" >> .config
        make defconfig
        
        echo -e "$(nproc) thread compile"
        make -j$(nproc) || make -j1 || make -j1 V=s
        echo "status=success" >> $GITHUB_OUTPUT
        grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME
        [ -s DEVICE_NAME ] && echo "DEVICE_NAME=_$(cat DEVICE_NAME)" >> $GITHUB_ENV
        echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV

    # ⬇️ 新增：输出 Ccache 命中率统计 ⬇️
    - name: Show Ccache Statistics
      if: steps.compile.outputs.status == 'success' && !cancelled()
      run: |
        echo "=========================================="
        echo "           Ccache Statistics              "
        echo "=========================================="
        ccache -s
        echo "=========================================="

    - name: Save Host Tools to Cache Dir
      if: steps.compile.outputs.status == 'success' && !cancelled()
      run: |
        mkdir -p /workdir/host_cache
        [ -d "/workdir/openwrt/staging_dir/host" ] && cp -ru /workdir/openwrt/staging_dir/host /workdir/host_cache/
        [ -d "/workdir/openwrt/staging_dir/hostpkg" ] && cp -ru /workdir/openwrt/staging_dir/hostpkg /workdir/host_cache/

    - name: Check space usage
      if: (!cancelled())
      run: df -hT

    - name: Upload bin directory
      uses: actions/upload-artifact@v4
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_BIN_DIR == 'true'
      with:
        name: OpenWrt_bin${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: openwrt/bin

    - name: Organize files
      id: organize
      if: env.UPLOAD_FIRMWARE == 'true' && !cancelled()
      run: |
        cd openwrt/bin/targets/*/*
        rm -rf packages
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Upload firmware directory
      uses: actions/upload-artifact@main
      if: steps.organize.outputs.status == 'success' && !cancelled()
      with:
        name: OpenWrt_firmware${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: ${{ env.FIRMWARE }}

    - name: Generate release tag
      id: tag
      if: env.UPLOAD_RELEASE == 'true' && !cancelled()
      run: |
        echo "release_tag=$(date +"%Y.%m.%d-%H%M")" >> $GITHUB_OUTPUT
        touch release.txt
        [ -n "${{ steps.gofile.outputs.url }}" ] && echo "🔗 [GoFile](${{ steps.gofile.outputs.url }})" >> release.txt
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Upload firmware to release
      uses: softprops/action-gh-release@v2
      if: steps.tag.outputs.status == 'success' && !cancelled()
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.tag.outputs.release_tag }}
        body_path: release.txt
        files: ${{ env.FIRMWARE }}/*

    - name: Delete workflow runs
      uses: Mattraks/delete-workflow-runs@v2
      with:
        retain_days: 0
        keep_minimum_runs: 2

    - name: Remove old Releases
      uses: dev-drprasad/delete-older-releases@master
      if: env.UPLOAD_RELEASE == 'true' && !cancelled()
      with:
        keep_latest: 8
        delete_tags: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
